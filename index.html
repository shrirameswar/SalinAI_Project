<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalinAI-Scan Pro | Copernicus Soil Intelligence</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b1120;
            --bg-panel: rgba(15, 23, 42, 0.92);
            --border: rgba(148, 163, 184, 0.12);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #0ea5e9;
            --red: #ef4444;
            --amber: #f59e0b;
            --green: #22c55e;
            --dark-red: #991b1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        html, body {
            height: 100%;
            background: var(--bg-dark);
            color: var(--text);
            overflow: hidden;
        }

        /* ===== HEADER (Copernicus Style) ===== */
        .top-bar {
            height: 52px;
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 2000;
            position: relative;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-group i {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .logo-group h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .logo-group h1 span {
            color: var(--accent);
        }

        .badge-copernicus {
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(14, 165, 233, 0.12);
            color: var(--accent);
            border: 1px solid rgba(14, 165, 233, 0.25);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: var(--text-muted);
            transition: all 0.3s ease;
            max-width: 380px;
            white-space: nowrap;
            overflow: hidden;
        }

        .status-pill.analyzing {
            background: rgba(14, 165, 233, 0.12);
            color: var(--accent);
            border-color: rgba(14, 165, 233, 0.35);
            animation: pulse 1.8s infinite;
        }

        .status-pill.success-red {
            background: rgba(239, 68, 68, 0.12);
            color: var(--red);
            border-color: rgba(239, 68, 68, 0.35);
        }

        .status-pill.success-amber {
            background: rgba(245, 158, 11, 0.12);
            color: var(--amber);
            border-color: rgba(245, 158, 11, 0.35);
        }

        .status-pill.success-green {
            background: rgba(34, 197, 94, 0.12);
            color: var(--green);
            border-color: rgba(34, 197, 94, 0.35);
        }

        .status-pill.error {
            background: rgba(239, 68, 68, 0.12);
            color: var(--red);
            border-color: rgba(239, 68, 68, 0.35);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        /* ===== LAYOUT ===== */
        .app-body {
            display: flex;
            height: calc(100vh - 52px);
        }

        /* ===== MAP ===== */
        #map {
            flex: 1;
            background: #050505;
            z-index: 1;
        }

        /* Leaflet overrides for dark theme */
        .leaflet-control-zoom a {
            background: var(--bg-panel) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(30, 41, 59, 0.95) !important;
        }
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.8) !important;
            color: var(--text-muted) !important;
            font-size: 0.65rem !important;
        }
        .leaflet-control-attribution a {
            color: var(--accent) !important;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 400px;
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .sidebar-content {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ===== CARDS ===== */
        .panel-card {
            background: rgba(11, 17, 32, 0.7);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }

        .panel-card:hover {
            border-color: rgba(14, 165, 233, 0.2);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .panel-title i {
            width: 18px;
            text-align: center;
        }

        /* ===== GAUGE ===== */
        .gauge-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .gauge {
            position: relative;
            width: 90px;
            height: 90px;
            flex-shrink: 0;
        }

        .gauge svg {
            transform: rotate(-90deg);
        }

        .gauge-track {
            fill: none;
            stroke: rgba(148, 163, 184, 0.08);
            stroke-width: 7;
        }

        .gauge-fill {
            fill: none;
            stroke-width: 7;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
        }

        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .gauge-value {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1;
        }

        .gauge-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gauge-info {
            flex: 1;
        }

        .gauge-info .level {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .gauge-info .desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .confidence-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 8px;
        }

        /* ===== METRICS ===== */
        .metrics-4 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .metric-box {
            background: rgba(11, 17, 32, 0.9);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .metric-box .val {
            font-size: 1.15rem;
            font-weight: 800;
            font-family: 'SF Mono', monospace;
        }

        .metric-box .lbl {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== SAT TAGS ===== */
        .tag-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(14, 165, 233, 0.08);
            border: 1px solid rgba(14, 165, 233, 0.18);
            color: var(--accent);
        }

        .tag.sar {
            background: rgba(34, 197, 94, 0.08);
            border-color: rgba(34, 197, 94, 0.18);
            color: var(--green);
        }

        .tag.warn {
            background: rgba(245, 158, 11, 0.08);
            border-color: rgba(245, 158, 11, 0.18);
            color: var(--amber);
        }

        /* ===== RECOMMENDATIONS ===== */
        .rec-box {
            background: rgba(11, 17, 32, 0.6);
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid var(--accent);
        }

        .rec-box h4 {
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rec-box p {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.55;
        }

        /* ===== CROP TABLE ===== */
        .crop-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        .crop-table th {
            text-align: left;
            padding: 8px 6px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        .crop-table td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.05);
        }

        .bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(148, 163, 184, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s ease;
        }

        /* ===== CHART ===== */
        .chart-wrap {
            position: relative;
            height: 170px;
            width: 100%;
        }

        /* ===== EMPTY STATE ===== */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty i {
            font-size: 2.8rem;
            margin-bottom: 14px;
            opacity: 0.25;
        }

        .empty p {
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* ===== MAP LEGEND ===== */
        .map-legend {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        .map-legend h4 {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .leg-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .leg-item:last-child { margin-bottom: 0; }

        .leg-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 0 8px currentColor;
            flex-shrink: 0;
        }

        /* ===== MARKER PULSE ===== */
        @keyframes danger-pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
            70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .marker-danger {
            animation: danger-pulse 2.2s infinite;
        }

        /* ===== POPUP ===== */
        .leaflet-popup-content-wrapper {
            background: var(--bg-panel) !important;
            backdrop-filter: blur(16px);
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            border-radius: 10px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
        }
        .leaflet-popup-tip {
            background: var(--bg-panel) !important;
            border: 1px solid var(--border) !important;
        }
        .leaflet-popup-content {
            margin: 12px 16px !important;
            line-height: 1.5 !important;
        }

        /* ===== SCROLLBAR ===== */
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.15); border-radius: 3px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .sidebar { 
                position: absolute; 
                right: 0; 
                height: 100%; 
                transform: translateX(100%);
                width: 100%;
                max-width: 400px;
            }
            .sidebar.open { transform: translateX(0); }
        }
    </style>
<base target="_blank">
</head>
<body>

    <!-- HEADER -->
    <header class="top-bar">
        <div class="logo-group">
            <i class="fas fa-satellite-dish"></i>
            <h1>SalinAI<span>Scan</span> Pro</h1>
            <span class="badge-copernicus">Copernicus Powered</span>
        </div>
        <div class="status-pill" id="status-box">
            <i class="fas fa-mouse-pointer"></i>
            <span>Click any location on the satellite map to analyze soil salinity</span>
        </div>
    </header>

    <!-- MAIN -->
    <div class="app-body">
        <div id="map"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-chart-pie" style="color: var(--accent); margin-right: 6px;"></i>Analysis Dashboard</h2>
                <p>AI-powered soil intelligence from Sentinel-2 & Sentinel-1 SAR</p>
            </div>

            <div class="sidebar-content" id="sidebar-content">
                <div class="empty">
                    <i class="fas fa-globe-americas"></i>
                    <p>Click anywhere on the satellite map to fetch Copernicus data and run AI soil analysis</p>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const BACKEND_URL = 'https://salinai-project.onrender.com/api/process-satellite-soil';
        // For local testing, change to: 'http://localhost:8000/api/process-satellite-soil'

        // ============================================================
        // MAP - Copernicus EO Browser Style (Satellite Imagery)
        // ============================================================
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([24.5, 78.0], 5);

        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.attribution({ 
            position: 'bottomright', 
            prefix: 'Copernicus Sentinel Data | &copy; Esri' 
        }).addTo(map);

        // BASE LAYER 1: ESRI World Imagery (Real Satellite Photos - like Copernicus)
        const satelliteLayer = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        // BASE LAYER 2: Dark overlay for Copernicus vibe (optional toggle)
        const darkOverlay = L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; CARTO',
            opacity: 0.4
        });

        // BASE LAYER 3: OpenStreetMap (fallback)
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        });

        // Default: Satellite imagery (Copernicus look)
        satelliteLayer.addTo(map);
        // darkOverlay.addTo(map); // Uncomment to add dark labels over satellite

        // Layer control
        const baseMaps = {
            "Satellite (Copernicus Style)": satelliteLayer,
            "OpenStreetMap": osmLayer
        };
        L.control.layers(baseMaps, null, { position: 'topright', collapsed: true }).addTo(map);

        let currentMarker = null;
        let charts = {};

        // ============================================================
        // COLOR HELPERS
        // ============================================================
        function getSalinityColor(score) {
            if (score >= 0.80) return '#991b1b';  // Extreme - Dark Red
            if (score >= 0.60) return '#ef4444';  // High - Red
            if (score >= 0.40) return '#f59e0b';  // Moderate - Amber
            if (score >= 0.20) return '#22c55e';  // Low - Green
            return '#15803d';                      // Very Low - Dark Green
        }

        function getMoistureColor(score) {
            if (score >= 0.80) return '#1e40af';
            if (score >= 0.60) return '#3b82f6';
            if (score >= 0.40) return '#0ea5e9';
            if (score >= 0.20) return '#f59e0b';
            return '#ef4444';
        }

        // ============================================================
        // COLORED MARKER FACTORY
        // ============================================================
        function createMarker(color, isHigh) {
            const pulse = isHigh ? 'marker-danger' : '';
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    background: ${color}; 
                    width: 22px; 
                    height: 22px; 
                    border-radius: 50%; 
                    border: 3px solid rgba(255,255,255,0.9); 
                    box-shadow: 0 0 0 5px ${color}40, 0 4px 12px rgba(0,0,0,0.5);
                " class="${pulse}"></div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11],
                popupAnchor: [0, -14]
            });
        }

        // ============================================================
        // MAP LEGEND
        // ============================================================
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function(map) {
            const div = L.DomUtil.create('div', 'map-legend');
            div.innerHTML = `
                <h4><i class="fas fa-layer-group" style="margin-right: 5px;"></i>Salinity Legend</h4>
                <div class="leg-item">
                    <div class="leg-dot" style="background: #ef4444; color: #ef4444;"></div>
                    <span><b style="color: #ef4444;">High</b> Salinity Risk</span>
                </div>
                <div class="leg-item">
                    <div class="leg-dot" style="background: #f59e0b; color: #f59e0b;"></div>
                    <span><b style="color: #f59e0b;">Medium</b> Salinity Risk</span>
                </div>
                <div class="leg-item">
                    <div class="leg-dot" style="background: #22c55e; color: #22c55e;"></div>
                    <span><b style="color: #22c55e;">Low</b> Salinity Risk</span>
                </div>
            `;
            return div;
        };
        legend.addTo(map);

        // ============================================================
        // GAUGE COMPONENT
        // ============================================================
        function createGauge(score, color, label) {
            const r = 38;
            const c = 2 * Math.PI * r;
            const off = c - (score * c);
            return `
                <div class="gauge">
                    <svg width="90" height="90">
                        <circle class="gauge-track" cx="45" cy="45" r="${r}"/>
                        <circle class="gauge-fill" cx="45" cy="45" r="${r}"
                            stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
                    </svg>
                    <div class="gauge-center">
                        <div class="gauge-value" style="color: ${color}">${Math.round(score * 100)}</div>
                        <div class="gauge-label">${label}</div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // RENDER SIDEBAR
        // ============================================================
        function renderSidebar(data) {
            const ai = data.ai_analysis;
            const s2 = data.satellite_data.sentinel2;
            const s1 = data.satellite_data.sentinel1;
            const coords = data.coordinates;

            const salColor = ai.salinity.risk_color;
            const moistColor = getMoistureColor(ai.moisture.score);

            const html = `
                <!-- Coordinates -->
                <div class="panel-card">
                    <div class="panel-title"><i class="fas fa-map-marker-alt"></i>Coordinates</div>
                    <div class="tag-row">
                        <div class="tag"><i class="fas fa-globe"></i>${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)}</div>
                        <div class="tag"><i class="fas fa-expand"></i>${coords.buffer_meters}m</div>
                    </div>
                </div>

                <!-- AI Scores -->
                <div class="panel-card">
                    <div class="panel-title"><i class="fas fa-brain"></i>AI Analysis</div>
                    <div class="gauge-row">
                        ${createGauge(ai.salinity.score, salColor, 'Salinity')}
                        <div class="gauge-info">
                            <div class="level" style="color: ${salColor}">${ai.salinity.level}</div>
                            <div class="desc">Ensemble of NDSI, ASTER-SI, and SAR backscatter.</div>
                            <span class="confidence-tag" style="background: ${salColor}15; color: ${salColor}; border: 1px solid ${salColor}30;">
                                <i class="fas fa-shield-alt"></i> ${Math.round(ai.confidence * 100)}% confidence
                            </span>
                        </div>
                    </div>
                    <div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);">
                        <div class="gauge-row">
                            ${createGauge(ai.moisture.score, moistColor, 'Moisture')}
                            <div class="gauge-info">
                                <div class="level" style="color: ${moistColor}">${ai.moisture.level} Moisture</div>
                                <div class="desc">From NDMI (NIR-SWIR) and Sentinel-1 VV backscatter.</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Spectral Indices -->
                <div class="panel-card">
                    <div class="panel-title"><i class="fas fa-satellite"></i>Spectral Indices</div>
                    <div class="metrics-4">
                        <div class="metric-box">
                            <div class="val" style="color: ${salColor}">${s2.indices.NDSI}</div>
                            <div class="lbl">NDSI (Salinity)</div>
                        </div>
                        <div class="metric-box">
                            <div class="val" style="color: ${moistColor}">${s2.indices.NDMI}</div>
                            <div class="lbl">NDMI (Moisture)</div>
                        </div>
                        <div class="metric-box">
                            <div class="val" style="color: #a855f7">${s2.indices.ASTER_SI}</div>
                            <div class="lbl">ASTER SI (SWIR)</div>
                        </div>
                        <div class="metric-box">
                            <div class="val" style="color: #22c55e">${s2.indices.NDVI}</div>
                            <div class="lbl">NDVI (Vegetation)</div>
                        </div>
                    </div>
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
                        <div class="tag-row">
                            <div class="tag"><i class="fas fa-satellite"></i> ${s2.source}</div>
                            <div class="tag sar"><i class="fas fa-radar"></i> ${s1.source}</div>
                            <div class="tag warn"><i class="fas fa-cloud"></i> ${s2.valid_pixel_pct}% clear</div>
                        </div>
                        <div style="font-size: 0.68rem; color: var(--text-muted); margin-top: 8px;">
                            <i class="fas fa-calendar-alt" style="margin-right: 4px;"></i>${s2.date_range}
                        </div>
                    </div>
                </div>

                <!-- SAR Validation -->
                <div class="panel-card">
                    <div class="panel-title"><i class="fas fa-radar"></i>Sentinel-1 SAR (Cloud-Free)</div>
                    <div class="metrics-4">
                        <div class="metric-box">
                            <div class="val" style="color: #0ea5e9">${s1.vv_backscatter_dB}</div>
                            <div class="lbl">VV Backscatter (dB)</div>
                        </div>
                        <div class="metric-box">
                            <div class="val" style="color: #0ea5e9">${s1.vh_backscatter_dB}</div>
                            <div class="lbl">VH Backscatter (dB)</div>
                        </div>
                    </div>
                    <p style="font-size: 0.74rem; color: var(--text-muted); margin-top: 10px; line-height: 1.5;">
                        <i class="fas fa-check-circle" style="color: var(--green); margin-right: 4px;"></i>
                        Cloud-free validation via C-band SAR. Sentinel-1 penetrates clouds regardless of weather.
                    </p>
                </div>

                <!-- Radar Chart -->
                <div class="panel-card">
                    <div class="panel-title"><i class="fas fa-chart-radar"></i>Soil Profile</div>
                    <div class="chart-wrap">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>

                <!-- Recommendations -->
                <div class="panel-card">
                    <div class="panel-title"><i class="fas fa-clipboard-check"></i>AI Recommendations</div>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div class="rec-box" style="border-left-color: ${salColor};">
                            <h4><i class="fas fa-exclamation-triangle" style="color: ${salColor};"></i>Immediate Action</h4>
                            <p>${ai.recommendation}</p>
                        </div>
                        <div class="rec-box" style="border-left-color: var(--accent);">
                            <h4><i class="fas fa-seedling" style="color: var(--accent);"></i>Long-term Strategy</h4>
                            <p>${ai.long_term_advice}</p>
                        </div>
                        <div class="rec-box" style="border-left-color: var(--green);">
                            <h4><i class="fas fa-tint" style="color: var(--green);"></i>Irrigation Plan</h4>
                            <p>${ai.irrigation_plan}</p>
                        </div>
                    </div>
                </div>

                <!-- Crop Suitability -->
                <div class="panel-card">
                    <div class="panel-title"><i class="fas fa-wheat"></i>Crop Suitability</div>
                    <table class="crop-table">
                        <thead>
                            <tr><th>Crop</th><th>Tolerance</th><th style="width: 45%;">Suitability</th></tr>
                        </thead>
                        <tbody>
                            ${ai.crop_suitability.map(crop => `
                                <tr>
                                    <td style="font-weight: 700;">${crop.crop}</td>
                                    <td style="color: var(--text-muted);">${crop.tolerance}</td>
                                    <td>
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <div class="bar-bg">
                                                <div class="bar-fill" style="width: ${crop.suitability}%; background: ${crop.suitability >= 80 ? '#22c55e' : crop.suitability >= 60 ? '#f59e0b' : '#ef4444'};"></div>
                                            </div>
                                            <span style="font-size: 0.7rem; font-weight: 700; min-width: 28px;">${crop.suitability}%</span>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <!-- Footer -->
                <div style="text-align: center; padding: 6px; font-size: 0.68rem; color: var(--text-muted);">
                    <i class="fas fa-${data.mode === 'LIVE' ? 'satellite' : 'microchip'}" style="margin-right: 4px;"></i>
                    Mode: <b>${data.mode}</b> &middot; ${new Date(data.processing_timestamp).toLocaleString()}
                </div>
            `;

            document.getElementById('sidebar-content').innerHTML = html;

            setTimeout(() => {
                const ctx = document.getElementById('radarChart').getContext('2d');
                if (charts.radar) charts.radar.destroy();

                charts.radar = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['Salinity\n(NDSI)', 'Moisture\n(NDMI)', 'SWIR\nSalinity', 'Vegetation\n(NDVI)', 'SAR\nVV', 'SAR\nVH'],
                        datasets: [{
                            data: [
                                Math.max(0, (s2.indices.NDSI + 0.5) * 100),
                                Math.max(0, (s2.indices.NDMI + 0.4) * 100),
                                Math.max(0, (s2.indices.ASTER_SI + 0.3) * 83),
                                s2.indices.NDVI * 100,
                                Math.max(0, (s1.vv_backscatter_dB + 20) * 5),
                                Math.max(0, (s1.vh_backscatter_dB + 25) * 4)
                            ],
                            backgroundColor: salColor + '25',
                            borderColor: salColor,
                            pointBackgroundColor: salColor,
                            pointBorderColor: '#fff',
                            borderWidth: 2,
                            pointRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            r: {
                                beginAtZero: true,
                                max: 100,
                                ticks: { display: false, backdropColor: 'transparent' },
                                grid: { color: 'rgba(148, 163, 184, 0.08)' },
                                pointLabels: { color: '#64748b', font: { size: 9 } }
                            }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }, 100);
        }

        // ============================================================
        // MAP CLICK HANDLER
        // ============================================================
        map.on('click', async function(e) {
            const lat = parseFloat(e.latlng.lat.toFixed(6));
            const lng = parseFloat(e.latlng.lng.toFixed(6));

            const statusBox = document.getElementById('status-box');
            statusBox.className = 'status-pill analyzing';
            statusBox.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i><span>Fetching Sentinel-2/1 data for (${lat}, ${lng})...</span>`;

            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ latitude: lat, longitude: lng })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('[SalinAI]', data);

                const score = data.ai_analysis.salinity.score;
                const color = data.ai_analysis.salinity.risk_color;
                const isHigh = score >= 0.60;
                const isMedium = score >= 0.40 && score < 0.60;
                const isLow = score < 0.40;

                // Place colored marker
                currentMarker = L.marker([lat, lng], { 
                    icon: createMarker(color, isHigh) 
                }).addTo(map);

                // Render sidebar
                renderSidebar(data);

                // Update status bar color
                statusBox.className = 'status-pill';
                statusBox.style.backgroundColor = '';
                statusBox.style.color = '';
                statusBox.style.borderColor = '';

                if (isHigh) {
                    statusBox.classList.add('success-red');
                    statusBox.innerHTML = `<i class="fas fa-exclamation-circle"></i><span>${data.ai_analysis.salinity.level} &middot; ${Math.round(data.ai_analysis.confidence * 100)}% confidence</span>`;
                } else if (isMedium) {
                    statusBox.classList.add('success-amber');
                    statusBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i><span>${data.ai_analysis.salinity.level} &middot; ${Math.round(data.ai_analysis.confidence * 100)}% confidence</span>`;
                } else {
                    statusBox.classList.add('success-green');
                    statusBox.innerHTML = `<i class="fas fa-check-circle"></i><span>${data.ai_analysis.salinity.level} &middot; ${Math.round(data.ai_analysis.confidence * 100)}% confidence</span>`;
                }

                // Popup
                const popupHtml = `
                    <div style="font-family: 'Segoe UI', sans-serif; min-width: 220px;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
                            <div style="width: 14px; height: 14px; border-radius: 50%; background: ${color}; border: 2px solid rgba(255,255,255,0.6); box-shadow: 0 0 8px ${color};"></div>
                            <h3 style="color: ${color}; margin: 0; font-size: 0.95rem; font-weight: 700;">${data.ai_analysis.salinity.level}</h3>
                        </div>
                        <div style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 3px;"><b>NDSI:</b> ${data.satellite_data.sentinel2.indices.NDSI}</div>
                        <div style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 3px;"><b>NDMI:</b> ${data.satellite_data.sentinel2.indices.NDMI}</div>
                        <div style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 3px;"><b>Moisture:</b> ${data.ai_analysis.moisture.level}</div>
                        <div style="font-size: 0.78rem; color: #64748b; margin-top: 10px; padding-top: 10px; border-top: 1px solid #334155;">
                            <i class="fas fa-lightbulb" style="color: #f59e0b; margin-right: 4px;"></i>${data.ai_analysis.recommendation}
                        </div>
                    </div>
                `;
                currentMarker.bindPopup(popupHtml).openPopup();

                // Alert toast for high salinity
                if (isHigh) {
                    L.popup({ className: '', closeButton: false, autoClose: true, closeOnEscapeKey: false, closeOnClick: false })
                    .setLatLng([lat, lng])
                    .setContent(`<div style="color: #ef4444; font-weight: 800; text-align: center; font-size: 0.85rem;"><i class="fas fa-exclamation-triangle" style="margin-right: 5px;"></i>HIGH SALINITY DETECTED</div>`)
                    .openOn(map);
                    setTimeout(() => { map.closePopup(); }, 2500);
                }

            } catch (err) {
                console.error('[SalinAI Error]', err);
                const errorIcon = createMarker('#64748b', false);
                currentMarker = L.marker([lat, lng], { icon: errorIcon }).addTo(map);

                statusBox.className = 'status-pill error';
                statusBox.innerHTML = `<i class="fas fa-times-circle"></i><span>Error: ${err.message}</span>`;

                alert(`Connection Error:\n${err.message}\n\nPlease check that the backend server is running.`);
            }
        });
    </script>
</body>
</html>
